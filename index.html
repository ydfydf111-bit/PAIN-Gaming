<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PAIN Gaming - Endless Runner</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

body {
  overflow: hidden;
  background: #05030b;
  font-family: Arial, sans-serif;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 25%, #3b123f 0%, #10091d 45%, #030208 100%);
}

/* السماء */
.sky {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(#080513 0%, #160b24 45%, #090612 100%);
}

/* النجوم */
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  opacity: .7;
}

/* الأرض */
.road {
  position: absolute;
  left: 50%;
  bottom: -8%;
  transform: translateX(-50%);
  width: 85%;
  height: 65%;
  background: linear-gradient(90deg,#09070e,#211326,#09070e);
  clip-path: polygon(38% 0,62% 0,100% 100%,0 100%);
  border-left: 3px solid #5b204e;
  border-right: 3px solid #5b204e;
}

/* خطوط الطريق */
.line {
  position: absolute;
  width: 8px;
  height: 80px;
  background: #e82c51;
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 15px #ff174b;
}

/* الشخصية */
#player {
  position: absolute;
  width: 75px;
  height: 130px;
  left: 50%;
  bottom: 18%;
  transform: translateX(-50%);
  z-index: 10;
}

/* الرأس */
.head {
  position: absolute;
  left: 20px;
  top: 0;
  width: 35px;
  height: 42px;
  background: linear-gradient(135deg,#111,#333);
  border-radius: 45% 45% 35% 35%;
  border: 3px solid #e52c42;
  box-shadow: 0 0 15px #e52c42;
}

/* قرون */
.head:before,
.head:after {
  content:"";
  position:absolute;
  top:-19px;
  width:15px;
  height:25px;
  background:#e51d39;
  clip-path:polygon(50% 0,100% 100%,0 70%);
}

.head:before { left:-5px; }
.head:after { right:-5px; }

/* الجسم */
.body {
  position: absolute;
  left: 14px;
  top: 38px;
  width: 47px;
  height: 62px;
  background: linear-gradient(135deg,#080808,#25252b,#090909);
  clip-path: polygon(25% 0,75% 0,100% 25%,85% 100%,15% 100%,0 25%);
  border: 2px solid #b92336;
}

/* القلب الأحمر */
.body:after {
  content:"";
  position:absolute;
  width:9px;
  height:40px;
  right:7px;
  top:8px;
  background:#f02a3f;
  transform:rotate(25deg);
  box-shadow:0 0 12px #ff183b;
}

/* الرجلين */
.leg {
  position:absolute;
  top:92px;
  width:20px;
  height:45px;
  background:#0b0b0d;
  border:2px solid #a71e32;
  border-radius:8px;
}

.leg.left { left:12px; }
.leg.right { right:12px; }

/* اليدين */
.arm {
  position:absolute;
  top:43px;
  width:16px;
  height:55px;
  background:#101014;
  border:2px solid #a71e32;
  border-radius:10px;
}

.arm.left { left:0; transform:rotate(18deg); }
.arm.right { right:0; transform:rotate(-18deg); }

/* العملات */
.coin {
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  background:linear-gradient(#fff27a,#ffb300,#ff6f00);
  border:3px solid #fff3a0;
  box-shadow:0 0 15px #ffb300;
  z-index:5;
}

.coin:after {
  content:"$";
  color:#7b3000;
  font-weight:bold;
  position:absolute;
  left:8px;
  top:3px;
}

/* الحواجز */
.obstacle {
  position:absolute;
  width:55px;
  height:55px;
  background:linear-gradient(135deg,#15151b,#050505);
  border:3px solid #ef2744;
  box-shadow:0 0 18px #e51d39;
  z-index:6;
}

.obstacle:before {
  content:"⚠";
  position:absolute;
  color:#ff304b;
  font-size:30px;
  left:10px;
  top:8px;
}

/* الواجهة */
#hud {
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  z-index:30;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.box {
  background:rgba(0,0,0,.55);
  border:1px solid #e52c42;
  border-radius:12px;
  padding:8px 13px;
  box-shadow:0 0 10px rgba(229,44,66,.3);
}

/* شاشة البداية */
#startScreen,
#gameOver {
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(3,2,8,.88);
  color:white;
  text-align:center;
}

#gameOver {
  display:none;
}

.title {
  font-size:45px;
  color:#ff304b;
  text-shadow:0 0 20px #ff174b;
  margin-bottom:10px;
}

.subtitle {
  font-size:18px;
  margin-bottom:30px;
  color:#ddd;
}

button {
  border:none;
  background:linear-gradient(135deg,#ff183f,#8d1025);
  color:white;
  padding:15px 40px;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 0 20px #e51d39;
}

/* أزرار الهاتف */
.controls {
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
  z-index:50;
}

.control {
  width:75px;
  height:65px;
  border-radius:20px;
  background:rgba(20,10,25,.75);
  border:2px solid #e52c42;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.jump {
  width:90px;
}

/* حركة الجري */
.running .leg.left {
  animation:run1 .18s infinite alternate;
}

.running .leg.right {
  animation:run2 .18s infinite alternate;
}

@keyframes run1 {
  from { transform:rotate(25deg); }
  to { transform:rotate(-25deg); }
}

@keyframes run2 {
  from { transform:rotate(-25deg); }
  to { transform:rotate(25deg); }
}
</style>
</head>

<body>

<div id="game">

  <div class="sky"></div>

  <div class="star" style="left:10%;top:15%"></div>
  <div class="star" style="left:25%;top:9%"></div>
  <div class="star" style="left:45%;top:18%"></div>
  <div class="star" style="left:70%;top:11%"></div>
  <div class="star" style="left:88%;top:20%"></div>

  <div class="road"></div>

  <div id="lines"></div>

  <div id="coins"></div>
  <div id="obstacles"></div>

  <!-- الشخصية -->
  <div id="player" class="running">
    <div class="head"></div>
    <div class="body"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  </div>

  <!-- النقاط -->
  <div id="hud">
    <div class="box">🪙 <span id="score">0</span></div>
    <div class="box">🏆 <span id="distance">0</span> m</div>
  </div>

  <!-- أزرار -->
  <div class="controls">
    <div class="control" id="left">◀</div>
    <div class="control jump" id="jump">⬆</div>
    <div class="control" id="right">▶</div>
  </div>

  <!-- البداية -->
  <div id="startScreen">
    <div class="title">PAIN GAMING</div>
    <div class="subtitle">ENDLESS RUNNER</div>
    <p style="margin-bottom:25px">
      تفادى الحواجز وجمع العملات 🔥
    </p>
    <button id="startBtn">ابدأ اللعبة</button>
  </div>

  <!-- النهاية -->
  <div id="gameOver">
    <div class="title">GAME OVER</div>
    <div class="subtitle">
      النقاط: <span id="finalScore">0</span>
    </div>
    <button id="restartBtn">عاود اللعب</button>
  </div>

</div>

<script>
const player = document.getElementById("player");
const game = document.getElementById("game");
const coinsBox = document.getElementById("coins");
const obstaclesBox = document.getElementById("obstacles");

const scoreText = document.getElementById("score");
const distanceText = document.getElementById("distance");
const finalScore = document.getElementById("finalScore");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

let playerX = 50;
let jumping = false;
let jumpPower = 0;
let score = 0;
let distance = 0;
let speed = 6;
let playing = false;

let coins = [];
let obstacles = [];

let lastSpawn = 0;
let lastCoin = 0;

function movePlayer(dir) {
  if (!playing) return;

  playerX += dir * 7;

  if (playerX < 20) playerX = 20;
  if (playerX > 80) playerX = 80;

  player.style.left = playerX + "%";
}

function jump() {
  if (!playing || jumping) return;

  jumping = true;
  jumpPower = 17;
}

function updateJump() {
  if (!jumping) return;

  let bottom = parseFloat(player.style.bottom) || 18;

  bottom += jumpPower;
  jumpPower -= 1.1;

  player.style.bottom = bottom + "%";

  if (bottom <= 18) {
    player.style.bottom = "18%";
    jumping = false;
    jumpPower = 0;
  }
}

function spawnCoin() {
  const coin = document.createElement("div");
  coin.className = "coin";

  const lane = [25,50,75][Math.floor(Math.random()*3)];

  coin.style.left = lane + "%";
  coin.style.top = "-40px";

  coinsBox.appendChild(coin);

  coins.push({
    el: coin,
    x: lane,
    y: -40
  });
}

function spawnObstacle() {
  const obstacle = document.createElement("div");
  obstacle.className = "obstacle";

  const lane = [25,50,75][Math.floor(Math.random()*3)];

  obstacle.style.left = "calc(" + lane + "% - 27px)";
  obstacle.style.top = "-70px";

  obstaclesBox.appendChild(obstacle);

  obstacles.push({
    el: obstacle,
    x: lane,
    y: -70
  });
}

function collision(a,b) {
  const ar = a.getBoundingClientRect();
  const br = b.getBoundingClientRect();

  return !(
    ar.right < br.left ||
    ar.left > br.right ||
    ar.bottom < br.top ||
    ar.top > br.bottom
  );
}

function updateObjects() {

  for (let i = coins.length - 1; i >= 0; i--) {

    const c = coins[i];

    c.y += speed;
    c.el.style.top = c.y + "px";

    if (collision(player,c.el)) {
      score += 10;
      scoreText.textContent = score;

      c.el.remove();
      coins.splice(i,1);
      continue;
    }

    if (c.y > innerHeight) {
      c.el.remove();
      coins.splice(i,1);
    }
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {

    const o = obstacles[i];

    o.y += speed;
    o.el.style.top = o.y + "px";

    if (!jumping && collision(player,o.el)) {
      endGame();
      return;
    }

    if (o.y > innerHeight) {
      o.el.remove();
      obstacles.splice(i,1);
    }
  }
}

function gameLoop(time) {

  if (!playing) return;

  updateJump();
  updateObjects();

  distance += 1;
  distanceText.textContent = distance;

  if (time - lastSpawn > 900) {
    spawnObstacle();
    lastSpawn = time;
  }

  if (time - lastCoin > 550) {
    spawnCoin();
    lastCoin = time;
  }

  if (distance % 500 === 0) {
    speed += .5;
  }

  requestAnimationFrame(gameLoop);
}

function startGame() {

  startScreen.style.display = "none";
  gameOverScreen.style.display = "none";

  score = 0;
  distance = 0;
  speed = 6;
  playerX = 50;

  scoreText.textContent = "0";
  distanceText.textContent = "0";

  player.style.left = "50%";
  player.style.bottom = "18%";

  coins.forEach(x => x.el.remove());
  obstacles.forEach(x => x.el.remove());

  coins = [];
  obstacles = [];

  playing = true;

  lastSpawn = performance.now();
  lastCoin = performance.now();

  requestAnimationFrame(gameLoop);
}

function endGame() {

  playing = false;

  finalScore.textContent = score;

  gameOverScreen.style.display = "flex";
}

document.getElementById("startBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = startGame;

document.getElementById("left").ontouchstart = () => movePlayer(-1);
document.getElementById("right").ontouchstart = () => movePlayer(1);
document.getElementById("jump").ontouchstart = jump;

document.addEventListener("keydown", e => {

  if (e.key === "ArrowLeft") movePlayer(-1);
  if (e.key === "ArrowRight") movePlayer(1);
  if (e.key === "ArrowUp" || e.key === " ") jump();

});

</script>

</body>
</html>
