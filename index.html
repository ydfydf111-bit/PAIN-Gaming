<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>PAIN Gaming - Endless Runner</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090713;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#090713;
}

#ui{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
  font-weight:bold;
  font-size:18px;
  z-index:5;
  text-shadow:0 2px 5px #000;
}

#title{
  color:#ff3030;
  font-size:20px;
}

#start{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(5,3,15,.75);
  z-index:10;
  color:white;
  text-align:center;
}

#start h1{
  font-size:42px;
  color:#ff3030;
  text-shadow:0 0 20px #ff2020;
  margin-bottom:10px;
}

#start p{
  margin-bottom:25px;
  font-size:17px;
}

button{
  border:0;
  padding:15px 35px;
  border-radius:12px;
  background:#e51d2a;
  color:white;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 0 20px rgba(255,30,40,.5);
}

#gameover{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(5,3,15,.8);
  z-index:20;
  color:white;
  text-align:center;
}

#gameover h2{
  font-size:42px;
  color:#ff3030;
  margin-bottom:10px;
}

#controls{
  position:fixed;
  bottom:25px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
  pointer-events:none;
  z-index:6;
}

.control{
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.3);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  pointer-events:auto;
  user-select:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="title">⚡ PAIN GAMING</div>
  <div>🏆 <span id="score">0</span></div>
  <div>💎 <span id="coins">0</span></div>
</div>

<div id="start">
  <h1>PAIN GAMING</h1>
  <p>ENDLESS RUNNER</p>
  <p>⬅️ ➡️ تغيير المسار • ⬆️ قفز • ⬇️ انحناء</p>
  <button id="startBtn">PLAY</button>
</div>

<div id="gameover">
  <h2>GAME OVER</h2>
  <p>Score: <span id="finalScore">0</span></p>
  <br>
  <button id="restartBtn">PLAY AGAIN</button>
</div>

<div id="controls">
  <div class="control" id="left">⬅️</div>
  <div class="control" id="jump">⬆️</div>
  <div class="control" id="slide">⬇️</div>
  <div class="control" id="right">➡️</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;
function resize(){
  W=canvas.width=innerWidth*devicePixelRatio;
  H=canvas.height=innerHeight*devicePixelRatio;
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=innerWidth;
  H=innerHeight;
}
addEventListener("resize",resize);
resize();

let running=false;
let score=0;
let coins=0;
let speed=7;
let distance=0;

const player={
  lane:1,
  x:0,
  y:0,
  jump:0,
  vy:0,
  sliding:false
};

let obstacles=[];
let gems=[];

function laneX(lane){
  const roadLeft=W*.25;
  const roadWidth=W*.5;
  return roadLeft + roadWidth*(lane+.5)/3;
}

function reset(){
  score=0;
  coins=0;
  speed=7;
  distance=0;

  player.lane=1;
  player.jump=0;
  player.vy=0;
  player.sliding=false;

  obstacles=[];
  gems=[];
}
function startGame(){
  reset();
  running=true;
  document.getElementById("start").style.display="none";
  document.getElementById("gameover").style.display="none";

  requestAnimationFrame(draw);
  requestAnimationFrame(loop);
}

function gameOver(){
  running=false;
  document.getElementById("finalScore").textContent=Math.floor(score);
  document.getElementById("gameover").style.display="flex";
}

document.getElementById("startBtn").onclick=startGame;
document.getElementById("restartBtn").onclick=startGame;

function moveLeft(){
  if(!running)return;
  player.lane=Math.max(0,player.lane-1);
}

function moveRight(){
  if(!running)return;
  player.lane=Math.min(2,player.lane+1);
}

function jump(){
  if(!running)return;
  if(player.jump===0){
    player.vy=17;
  }
}

function slide(){
  if(!running)return;
  player.sliding=true;
  setTimeout(()=>player.sliding=false,600);
}

document.getElementById("left").ontouchstart=e=>{
  e.preventDefault();moveLeft();
};
document.getElementById("right").ontouchstart=e=>{
  e.preventDefault();moveRight();
};
document.getElementById("jump").ontouchstart=e=>{
  e.preventDefault();jump();
};
document.getElementById("slide").ontouchstart=e=>{
  e.preventDefault();slide();
};

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")moveLeft();
  if(e.key==="ArrowRight")moveRight();
  if(e.key==="ArrowUp"||e.key===" ")jump();
  if(e.key==="ArrowDown")slide();
});

let touchX=0;
let touchY=0;

canvas.addEventListener("touchstart",e=>{
  touchX=e.touches[0].clientX;
  touchY=e.touches[0].clientY;
});

canvas.addEventListener("touchend",e=>{
  let dx=e.changedTouches[0].clientX-touchX;
  let dy=e.changedTouches[0].clientY-touchY;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>40)moveRight();
    if(dx<-40)moveLeft();
  }else{
    if(dy<-40)jump();
    if(dy>40)slide();
  }
});

function spawnObstacle(){
  const lane=Math.floor(Math.random()*3);

  obstacles.push({
    lane,
    z:1,
    type:Math.random()<.25?"high":"block"
  });
}

function spawnGem(){
  const lane=Math.floor(Math.random()*3);

  gems.push({
    lane,
    z:1,
    collected:false
  });
}

let obstacleTimer=0;
let gemTimer=0;

function update(){
  if(!running)return;

  distance+=speed;
  score+=speed*.04;

  speed+=0.002;

  obstacleTimer-=speed;
  gemTimer-=speed;

  if(obstacleTimer<=0){
    spawnObstacle();
    obstacleTimer=220+Math.random()*180;
  }

  if(gemTimer<=0){
    spawnGem();
    gemTimer=120+Math.random()*140;
  }

  if(player.jump>0 || player.vy!==0){
    player.jump+=player.vy;
    player.vy-=0.8;

    if(player.jump<=0){
      player.jump=0;
      player.vy=0;
    }
  }

  const targetX=laneX(player.lane);
  player.x+=(targetX-player.x)*.18;

  for(let o of obstacles){
    o.z-=speed*.0025;
  }

  for(let g of gems){
    g.z-=speed*.0025;
  }

  checkCollisions();

  obstacles=obstacles.filter(o=>o.z>-0.1);
  gems=gems.filter(g=>g.z>-0.1 && !g.collected);

  document.getElementById("score").textContent=Math.floor(score);
  document.getElementById("coins").textContent=coins;
}

function checkCollisions(){

  for(let o of obstacles){

    if(o.z<.16 && o.z>.02 && o.lane===player.lane){

      if(o.type==="block"){

        if(player.jump<55){
          gameOver();
          return;
        }

      }else{

        if(!player.sliding){
          gameOver();
          return;
        }

      }
    }
  }

  for(let g of gems){

    if(g.z<.18 && g.z>.02 && g.lane===player.lane){

      if(player.jump>0 || player.jump===0){
        coins++;
        score+=25;
        g.collected=true;
      }
    }
  }
}

function drawBackground(){

  const horizon=H*.30;

  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#070514");
  grad.addColorStop(.45,"#161027");
  grad.addColorStop(1,"#05040b");

  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // moon
  ctx.beginPath();
  ctx.arc(W*.82,H*.14,35,0,Math.PI*2);
  ctx.fillStyle="#b9b8d9";
  ctx.globalAlpha=.25;
  ctx.fill();
  ctx.globalAlpha=1;

  // city
  for(let i=0;i<18;i++){

    const bw=35+Math.random()*45;
    const bh=40+Math.random()*120;
    const x=i*70;

    ctx.fillStyle="#111020";
    ctx.fillRect(x,horizon-bh,bw,bh);

    ctx.fillStyle="#d7333d";
    for(let y=horizon-bh+15;y<horizon-5;y+=20){
      ctx.fillRect(x+8,y,5,7);
    }
  }
}

function drawRoad(){

  const horizon=H*.30;

  ctx.beginPath();
  ctx.moveTo(W*.43,horizon);
  ctx.lineTo(W*.57,horizon);
  ctx.lineTo(W*.93,H);
  ctx.lineTo(W*.07,H);
  ctx.closePath();

  const roadGrad=ctx.createLinearGradient(0,horizon,0,H);
  roadGrad.addColorStop(0,"#181523");
  roadGrad.addColorStop(1,"#050509");

  ctx.fillStyle=roadGrad;
  ctx.fill();

  // road edges
  ctx.strokeStyle="#e52635";
  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.moveTo(W*.43,horizon);
  ctx.lineTo(W*.07,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W*.57,horizon);
  ctx.lineTo(W*.93,H);
  ctx.stroke();

  // lane lines
  for(let lane=1;lane<3;lane++){

    const topX=W*.43+(W*.14)*(lane/3);
    const bottomX=W*.07+(W*.86)*(lane/3);

    ctx.strokeStyle="rgba(255,255,255,.25)";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(topX,horizon);
    ctx.lineTo(bottomX,H);
    ctx.stroke();
  }
}

function perspective(z){
  return 1-z;
}

function drawObstacle(o){

  if(o.z>1)return;

  const p=perspective(o.z);
  const x=laneX(o.lane);

  const y=H*.30 + p*p*(H*.65);

  const size=35+p*70;

  if(o.type==="block"){

    ctx.fillStyle="#e31e32";
    ctx.shadowColor="#ff2030";
    ctx.shadowBlur=18;

    ctx.fillRect(x-size/2,y-size,size,size);

    ctx.shadowBlur=0;

    ctx.fillStyle="#18060a";
    ctx.fillRect(x-size*.32,y-size*.72,size*.64,size*.12);

  }else{

    ctx.strokeStyle="#ff2c39";
    ctx.lineWidth=10;

    ctx.beginPath();
    ctx.moveTo(x-size,y-size*.8);
    ctx.lineTo(x+size,y-size*.8);
    ctx.stroke();

    ctx.strokeStyle="#6b1420";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.moveTo(x-size,y-size*.8);
    ctx.lineTo(x-size,y);
    ctx.moveTo(x+size,y-size*.8);
    ctx.lineTo(x+size,y);
    ctx.stroke();
  }
}

function drawGem(g){

  if(g.z>1)return;

  const p=perspective(g.z);
  const x=laneX(g.lane);
  const y=H*.30+p*p*(H*.65);

  const s=10+p*20;

  ctx.save();
  ctx.translate(x,y-s*2);

  ctx.rotate(Math.PI/4);

  ctx.fillStyle="#22cfff";
  ctx.shadowColor="#00cfff";
  ctx.shadowBlur=20;

  ctx.fillRect(-s/2,-s/2,s,s);

  ctx.restore();
  ctx.shadowBlur=0;
}

function drawPlayer(){

  const x=player.x || laneX(1);
  const ground=H*.82;
  const y=ground-player.jump;

  ctx.save();
  ctx.translate(x,y);

  const scale=player.sliding?.75:1;

  ctx.scale(scale,scale);

  // shadow
  ctx.beginPath();
  ctx.ellipse(0,8,35,10,0,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,.5)";
  ctx.fill();

  // legs
  ctx.fillStyle="#111";
  ctx.fillRect(-19,-65,14,58);
  ctx.fillRect(5,-65,14,58);

  // red boots
  ctx.fillStyle="#e62232";
  ctx.fillRect(-21,-12,18,9);
  ctx.fillRect(4,-12,18,9);

  // body armor
  ctx.fillStyle="#111318";
  ctx.beginPath();
  ctx.moveTo(-28,-125);
  ctx.lineTo(28,-125);
  ctx.lineTo(34,-65);
  ctx.lineTo(0,-45);
  ctx.lineTo(-34,-65);
  ctx.closePath();
  ctx.fill();

  // red armor
  ctx.fillStyle="#d82030";
  ctx.beginPath();
  ctx.moveTo(0,-118);
  ctx.lineTo(15,-95);
  ctx.lineTo(0,-72);
  ctx.lineTo(-15,-95);
  ctx.closePath();
  ctx.fill();

  // arms
  ctx.strokeStyle="#15171b";
  ctx.lineWidth=17;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-23,-108);
  ctx.lineTo(-48,-72);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(23,-108);
  ctx.lineTo(48,-72);
  ctx.stroke();

  // red arm blades
  ctx.strokeStyle="#f02535";
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.moveTo(-45,-82);
  ctx.lineTo(-55,-105);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(45,-82);
  ctx.lineTo(55,-105);
  ctx.stroke();

  // helmet
  ctx.fillStyle="#090a0e";
  ctx.beginPath();
  ctx.arc(0,-145,32,0,Math.PI*2);
  ctx.fill();

  // red horns
  ctx.fillStyle="#ed2737";

  ctx.beginPath();
  ctx.moveTo(-22,-164);
  ctx.lineTo(-35,-197);
  ctx.lineTo(-8,-172);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(22,-164);
  ctx.lineTo(35,-197);
  ctx.lineTo(8,-172);
  ctx.closePath();
  ctx.fill();

  // visor
  ctx.fillStyle="#ff303c";
  ctx.fillRect(-22,-151,44,8);

  ctx.restore();
}

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawRoad();

  // objects
  for(let g of gems)drawGem(g);
  for(let o of obstacles)drawObstacle(o);

  drawPlayer();

  if(running){
    requestAnimationFrame(draw);
  }
}

function loop(){
  update();

  if(running){
    requestAnimationFrame(loop);
  }
}

player.x=laneX(1);

function launch(){
  draw();
  loop();
}

launch();
</script>

</body>
</html>
