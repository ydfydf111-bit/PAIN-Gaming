<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PAIN GAMING</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05030b;font-family:Arial}
canvas{position:fixed;inset:0;width:100%;height:100%}

#hud{
 position:fixed;top:14px;left:15px;right:15px;
 display:flex;justify-content:space-between;
 color:white;font-size:19px;font-weight:bold;
 z-index:10;text-shadow:0 2px 5px #000
}
#title{color:#ff2638}

.panel{
 position:fixed;inset:0;z-index:20;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 color:white;text-align:center;
 background:rgba(3,2,10,.72)
}
.panel h1{font-size:45px;color:#ff2638;text-shadow:0 0 25px red}
.panel h2{font-size:40px;color:#ff2638}
.panel p{margin:8px;font-size:18px}

button{
 margin-top:22px;padding:14px 55px;
 border:2px solid #ff3545;border-radius:12px;
 background:#d7192a;color:white;
 font-size:23px;font-weight:bold
}

#gameover{display:none}

#controls{
 position:fixed;bottom:25px;left:0;right:0;
 display:flex;justify-content:space-between;
 padding:0 25px;z-index:15;pointer-events:none
}

.control{
 width:65px;height:65px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:rgba(30,30,40,.75);
 border:2px solid rgba(255,255,255,.35);
 color:white;font-size:29px;
 pointer-events:auto
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
 <div id="title">⚡ PAIN GAMING</div>
 <div>🏆 <span id="score">0</span></div>
 <div>💎 <span id="coins">0</span></div>
</div>

<div id="start" class="panel">
 <h1>PAIN GAMING</h1>
 <p>ENDLESS RUNNER</p>
 <p>⬅️ ➡️ تغيير المسار</p>
 <p>⬆️ قفز &nbsp; ⬇️ انحناء</p>
 <button id="play">PLAY</button>
</div>

<div id="gameover" class="panel">
 <h2>GAME OVER</h2>
 <p>Score: <span id="finalScore">0</span></p>
 <p>💎 Coins: <span id="finalCoins">0</span></p>
 <button id="again">PLAY AGAIN</button>
</div>

<div id="controls">
 <div class="control" id="left">⬅️</div>
 <div class="control" id="jump">⬆️</div>
 <div class="control" id="slide">⬇️</div>
 <div class="control" id="right">➡️</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=1;

const player={
 lane:1,
 x:0,
 jump:0,
 vy:0,
 sliding:false
};

let running=false;
let score=0;
let coins=0;
let speed=7;
let distance=0;
let obstacles=[];
let gems=[];
let obstacleTimer=70;
let gemTimer=35;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;
 H=innerHeight;
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
 player.x=getLaneX(player.lane,H*.82);
}

addEventListener("resize",resize);

/* الطريق في الخلف والقدام */
function roadAt(y){
 const horizon=H*.31;
 let t=(y-horizon)/(H-horizon);
 t=Math.max(0,Math.min(1,t));

 const left=W*(.43-.39*t);
 const right=W*(.57+.39*t);

 return {
   left:left,
   right:right,
   width:right-left
 };
}

/* وسط كل مسار حسب مكانه في الطريق */
function getLaneX(lane,y){
 const r=roadAt(y);
 return r.left+r.width*((lane+.5)/3);
}

function reset(){
 score=0;
 coins=0;
 speed=7;
 distance=0;
 obstacles=[];
 gems=[];
 obstacleTimer=70;
 gemTimer=35;

 player.lane=1;
 player.jump=0;
 player.vy=0;
 player.sliding=false;
 player.x=getLaneX(1,H*.82);

 document.getElementById("score").textContent=0;
 document.getElementById("coins").textContent=0;
}

function startGame(){
 reset();
 running=true;
 document.getElementById("start").style.display="none";
 document.getElementById("gameover").style.display="none";
}

function gameOver(){
 running=false;
 document.getElementById("finalScore").textContent=Math.floor(score);
 document.getElementById("finalCoins").textContent=coins;
 document.getElementById("gameover").style.display="flex";
}

document.getElementById("play").onclick=startGame;
document.getElementById("again").onclick=startGame;

function moveLeft(){
 if(!running)return;
 player.lane=Math.max(0,player.lane-1);
}

function moveRight(){
 if(!running)return;
 player.lane=Math.min(2,player.lane+1);
}

function jump(){
 if(!running)return;
 if(player.jump===0)player.vy=16;
}

function slide(){
 if(!running)return;
 if(player.sliding)return;

 player.sliding=true;

 setTimeout(()=>{
   player.sliding=false;
 },600);
}

function bind(id,fn){
 const el=document.getElementById(id);

 el.addEventListener("touchstart",e=>{
   e.preventDefault();
   fn();
 },{passive:false});

 el.addEventListener("mousedown",e=>{
   e.preventDefault();
   fn();
 });
}

bind("left",moveLeft);
bind("right",moveRight);
bind("jump",jump);
bind("slide",slide);

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")moveLeft();
 if(e.key==="ArrowRight")moveRight();
 if(e.key==="ArrowUp"||e.key===" ")jump();
 if(e.key==="ArrowDown")slide();
});

/* السحب باللمس */
let sx=0,sy=0;

canvas.addEventListener("touchstart",e=>{
 sx=e.touches[0].clientX;
 sy=e.touches[0].clientY;
},{passive:true});

canvas.addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].clientX-sx;
 const dy=e.changedTouches[0].clientY-sy;

 if(Math.abs(dx)>Math.abs(dy)){
   if(dx>40)moveRight();
   if(dx<-40)moveLeft();
 }else{
   if(dy<-40)jump();
   if(dy>40)slide();
 }
},{passive:true});

function spawnObstacle(){
 obstacles.push({
   lane:Math.floor(Math.random()*3),
   z:1,
   type:Math.random()<.25?"high":"block"
 });
}

function spawnGem(){
 gems.push({
   lane:Math.floor(Math.random()*3),
   z:1,
   collected:false
 });
}

function update(){
 if(!running)return;

 distance+=speed;
 score+=speed*.04;
 speed+=.0015;

 obstacleTimer-=speed;
 gemTimer-=speed;

 if(obstacleTimer<=0){
   spawnObstacle();
   obstacleTimer=180+Math.random()*150;
 }

 if(gemTimer<=0){
   spawnGem();
   gemTimer=80+Math.random()*100;
 }

 if(player.jump>0||player.vy!==0){
   player.jump+=player.vy;
   player.vy-=.75;

   if(player.jump<=0){
     player.jump=0;
     player.vy=0;
   }
 }

 /* الشخصية تتحرك داخل المسار الصحيح */
 const target=getLaneX(player.lane,H*.82);
 player.x+=(target-player.x)*.18;

 for(const o of obstacles){
   o.z-=speed*.0028;
 }

 for(const g of gems){
   g.z-=speed*.0028;
 }

 collisions();

 obstacles=obstacles.filter(o=>o.z>-.15);
 gems=gems.filter(g=>g.z>-.15&&!g.collected);

 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("coins").textContent=coins;
}

function collisions(){

 for(const o of obstacles){

   if(o.z<.17&&o.z>.015&&o.lane===player.lane){

     if(o.type==="block"){

       if(player.jump<55){
         gameOver();
         return;
       }

     }else{

       if(!player.sliding){
         gameOver();
         return;
       }

     }
   }
 }

 for(const g of gems){

   if(
     g.z<.18&&
     g.z>.01&&
     g.lane===player.lane&&
     !g.collected
   ){
     coins++;
     score+=25;
     g.collected=true;
   }
 }
}

function drawBackground(){

 const horizon=H*.31;

 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,"#05030d");
 grad.addColorStop(.5,"#17102b");
 grad.addColorStop(1,"#05040a");

 ctx.fillStyle=grad;
 ctx.fillRect(0,0,W,H);

 /* النجوم */
 for(let i=0;i<50;i++){
   const x=(i*97)%W;
   const y=(i*47)%(horizon-15);

   ctx.fillStyle="rgba(255,255,255,.5)";
   ctx.fillRect(x,y,2,2);
 }

 /* القمر */
 ctx.beginPath();
 ctx.arc(W*.82,H*.13,35,0,Math.PI*2);
 ctx.fillStyle="rgba(220,220,240,.28)";
 ctx.fill();

 /* المدينة */
 for(let i=0;i<20;i++){

   const bw=25+(i*17)%45;
   const bh=50+(i*31)%120;
   const x=i*(W/20);

   ctx.fillStyle="#0d0c18";
   ctx.fillRect(x,horizon-bh,bw,bh);

   for(let y=horizon-bh+15;y<horizon-8;y+=22){
     ctx.fillStyle="#c92131";
     ctx.fillRect(x+7,y,5,7);
   }
 }
}

function drawRoad(){

 const horizon=H*.31;

 ctx.beginPath();
 ctx.moveTo(W*.43,horizon);
 ctx.lineTo(W*.57,horizon);
 ctx.lineTo(W*.96,H);
 ctx.lineTo(W*.04,H);
 ctx.closePath();

 const grad=ctx.createLinearGradient(0,horizon,0,H);
 grad.addColorStop(0,"#292431");
 grad.addColorStop(1,"#07070b");

 ctx.fillStyle=grad;
 ctx.fill();

 /* جوانب الطريق */
 ctx.strokeStyle="#ff2538";
 ctx.lineWidth=5;

 ctx.beginPath();
 ctx.moveTo(W*.43,horizon);
 ctx.lineTo(W*.04,H);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(W*.57,horizon);
 ctx.lineTo(W*.96,H);
 ctx.stroke();

 /* 3 مسارات */
 for(let lane=1;lane<3;lane++){

   const topX=getLaneX(lane-0.5,horizon);
   const bottomX=getLaneX(lane-0.5,H);

   ctx.strokeStyle="rgba(255,255,255,.28)";
   ctx.lineWidth=3;

   ctx.beginPath();
   ctx.moveTo(topX,horizon);
   ctx.lineTo(bottomX,H);
   ctx.stroke();
 }
}

function drawObstacle(o){

 const p=1-o.z;

 const y=H*.31+p*p*(H*.60);

 /* هنا النقطة المهمة:
    X ديال الحاجز تابع لنفس perspective ديال الطريق */
 const x=getLaneX(o.lane,y);

 const size=30+p*85;

 if(o.type==="block"){

   ctx.save();

   ctx.shadowColor="#ff2035";
   ctx.shadowBlur=20;

   ctx.fillStyle="#df1d30";

   ctx.fillRect(
     x-size/2,
     y-size,
     size,
     size
   );

   ctx.shadowBlur=0;

   ctx.fillStyle="#26050a";

   ctx.fillRect(
     x-size*.3,
     y-size*.72,
     size*.6,
     size*.13
   );

   ctx.restore();

 }else{

   ctx.save();

   ctx.strokeStyle="#ff2639";
   ctx.lineWidth=9;

   ctx.shadowColor="#ff2035";
   ctx.shadowBlur=15;

   ctx.beginPath();
   ctx.moveTo(x-size,y-size*.8);
   ctx.lineTo(x+size,y-size*.8);
   ctx.stroke();

   ctx.shadowBlur=0;

   ctx.strokeStyle="#781521";
   ctx.lineWidth=5;

   ctx.beginPath();
   ctx.moveTo(x-size,y-size*.8);
   ctx.lineTo(x-size,y);

   ctx.moveTo(x+size,y-size*.8);
   ctx.lineTo(x+size,y);

   ctx.stroke();

   ctx.restore();
 }
}

function drawGem(g){

 const p=1-g.z;

 const y=H*.31+p*p*(H*.60);
 const x=getLaneX(g.lane,y);

 const s=10+p*25;

 ctx.save();

 ctx.translate(x,y-s*2);
 ctx.rotate(Math.PI/4);

 ctx.fillStyle="#20d8ff";
 ctx.shadowColor="#00d5ff";
 ctx.shadowBlur=20;

 ctx.fillRect(-s/2,-s/2,s,s);

 ctx.restore();

 ctx.shadowBlur=0;
}

function drawPlayer(){

 const ground=H*.82;
 const y=ground-player.jump;

 ctx.save();

 ctx.translate(player.x,y);

 ctx.scale(
   player.sliding?.72:1,
   player.sliding?.72:1
 );

 /* shadow */
 ctx.beginPath();
 ctx.ellipse(0,7,38,10,0,0,Math.PI*2);
 ctx.fillStyle="rgba(0,0,0,.55)";
 ctx.fill();

 /* legs */
 ctx.fillStyle="#0b0c10";
 ctx.fillRect(-20,-65,15,55);
 ctx.fillRect(5,-65,15,55);

 /* boots */
 ctx.fillStyle="#e92335";
 ctx.fillRect(-23,-15,20,10);
 ctx.fillRect(4,-15,20,10);

 /* body */
 ctx.fillStyle="#101216";

 ctx.beginPath();
 ctx.moveTo(-30,-128);
 ctx.lineTo(30,-128);
 ctx.lineTo(36,-67);
 ctx.lineTo(0,-45);
 ctx.lineTo(-36,-67);
 ctx.closePath();
 ctx.fill();

 /* chest */
 ctx.fillStyle="#df2031";

 ctx.beginPath();
 ctx.moveTo(0,-120);
 ctx.lineTo(18,-96);
 ctx.lineTo(0,-70);
 ctx.lineTo(-18,-96);
 ctx.closePath();
 ctx.fill();

 /* arms */
 ctx.strokeStyle="#111318";
 ctx.lineWidth=18;
 ctx.lineCap="round";

 ctx.beginPath();
 ctx.moveTo(-25,-108);
 ctx.lineTo(-50,-70);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(25,-108);
 ctx.lineTo(50,-70);
 ctx.stroke();

 /* red blades */
 ctx.strokeStyle="#ff2438";
 ctx.lineWidth=5;

 ctx.beginPath();
 ctx.moveTo(-47,-82);
 ctx.lineTo(-58,-106);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(47,-82);
 ctx.lineTo(58,-106);
 ctx.stroke();

 /* helmet */
 ctx.fillStyle="#080a0e";

 ctx.beginPath();
 ctx.arc(0,-147,32,0,Math.PI*2);
 ctx.fill();

 /* horns */
 ctx.fillStyle="#ed2538";

 ctx.beginPath();
 ctx.moveTo(-21,-165);
 ctx.lineTo(-37,-199);
 ctx.lineTo(-7,-174);
 ctx.closePath();
 ctx.fill();

 ctx.beginPath();
 ctx.moveTo(21,-165);
 ctx.lineTo(37,-199);
 ctx.lineTo(7,-174);
 ctx.closePath();
 ctx.fill();

 /* visor */
 ctx.fillStyle="#ff3342";
 ctx.shadowColor="#ff2438";
 ctx.shadowBlur=12;

 ctx.fillRect(-22,-152,44,8);

 ctx.shadowBlur=0;

 ctx.restore();
}

function draw(){

 ctx.clearRect(0,0,W,H);

 drawBackground();
 drawRoad();

 for(const g of gems)drawGem(g);
 for(const o of obstacles)drawObstacle(o);

 drawPlayer();
}

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);
}

resize();
loop();

</script>

</body>
</html>
