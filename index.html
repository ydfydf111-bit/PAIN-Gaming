<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>PAIN GAMING</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:#070707;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  color:white;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}

.hudBox{
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,0,0,.35);
  border-radius:12px;
  padding:8px 12px;
}

#title{
  color:#ff2020;
  letter-spacing:2px;
}

.panel{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(88%,420px);
  padding:28px;
  text-align:center;
  color:white;
  background:rgba(5,5,5,.88);
  border:2px solid #a00000;
  border-radius:20px;
  z-index:10;
  box-shadow:0 0 40px rgba(255,0,0,.25);
}

.panel h1{
  font-size:42px;
  color:#ff2020;
  margin-bottom:10px;
}

.panel p{
  opacity:.8;
  margin-bottom:20px;
}

.play{
  border:0;
  background:linear-gradient(#ff3030,#900000);
  color:white;
  font-size:22px;
  font-weight:bold;
  padding:14px 45px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(255,0,0,.3);
}

.hidden{
  display:none;
}

#touchControls{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:8;
}

.touchBtn{
  width:62px;
  height:58px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.55);
  color:white;
  font-size:25px;
  backdrop-filter:blur(5px);
}

.touchBtn:active{
  transform:scale(.9);
  background:rgba(150,0,0,.75);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hudBox" id="title">PAIN GAMING</div>
  <div class="hudBox">SCORE: <span id="score">0</span></div>
  <div class="hudBox">💎 <span id="coins">0</span></div>
</div>

<div id="startPanel" class="panel">
  <h1>PAIN</h1>
  <p>Swipe to move • Jump • Slide</p>
  <button class="play" id="playBtn">PLAY</button>
</div>

<div id="gameOverPanel" class="panel hidden">
  <h1>GAME OVER</h1>
  <p>Score: <span id="finalScore">0</span></p>
  <button class="play" id="againBtn">PLAY AGAIN</button>
</div>

<div id="touchControls">
  <button class="touchBtn" id="leftBtn">◀</button>
  <button class="touchBtn" id="jumpBtn">▲</button>
  <button class="touchBtn" id="slideBtn">▼</button>
  <button class="touchBtn" id="rightBtn">▶</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================
   GAME STATE
========================= */

let running=false;

let score=0;
let coins=0;

let speed=0.010;
let distance=0;

let spawnTimer=0;
let gemTimer=0;

let obstacles=[];
let gems=[];

const player={
  lane:0,
  x:0,
  jump:0,
  vy:0,
  sliding:false
};


/* =========================
   PERSPECTIVE ROAD
========================= */

function roadAt(y){

  const horizon=H*.30;

  let t=(y-horizon)/(H-horizon);

  t=Math.max(0,Math.min(1,t));

  const left=W*(.43-.39*t);
  const right=W*(.57+.39*t);

  return {
    left,
    right,
    width:right-left
  };
}

function getLaneX(lane,y){

  const r=roadAt(y);

  return r.left+r.width*((lane+.5)/3);
}


/* =========================
   RESET
========================= */

function resetGame(){

  score=0;
  coins=0;

  speed=.010;
  distance=0;

  spawnTimer=0;
  gemTimer=0;

  obstacles=[];
  gems=[];

  player.lane=0;
  player.jump=0;
  player.vy=0;
  player.sliding=false;

  player.x=getLaneX(0,H*.82);

  document.getElementById("score").textContent=0;
  document.getElementById("coins").textContent=0;
}


/* =========================
   START
========================= */

function startGame(){

  resetGame();

  running=true;

  document.getElementById("startPanel")
    .classList.add("hidden");

  document.getElementById("gameOverPanel")
    .classList.add("hidden");
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  if(!running)return;

  running=false;

  document.getElementById("finalScore")
    .textContent=Math.floor(score);

  document.getElementById("gameOverPanel")
    .classList.remove("hidden");
}


/* =========================
   PLAYER MOVEMENT
========================= */

function moveLeft(){

  if(!running)return;

  if(player.lane>-1){
    player.lane--;
  }
}

function moveRight(){

  if(!running)return;

  if(player.lane<1){
    player.lane++;
  }
}

function jump(){

  if(!running)return;

  if(player.jump===0){

    player.vy=-0.035;
  }
}

function slide(){

  if(!running)return;

  player.sliding=true;

  setTimeout(()=>{
    player.sliding=false;
  },550);
}


/* =========================
   BUTTON CONTROLS
========================= */

document.getElementById("leftBtn")
.addEventListener("touchstart",e=>{
  e.preventDefault();
  moveLeft();
},{passive:false});

document.getElementById("rightBtn")
.addEventListener("touchstart",e=>{
  e.preventDefault();
  moveRight();
},{passive:false});

document.getElementById("jumpBtn")
.addEventListener("touchstart",e=>{
  e.preventDefault();
  jump();
},{passive:false});

document.getElementById("slideBtn")
.addEventListener("touchstart",e=>{
  e.preventDefault();
  slide();
},{passive:false});


/* =========================
   SWIPE CONTROLS
========================= */

let touchStartX=0;
let touchStartY=0;

canvas.addEventListener("touchstart",e=>{

  const t=e.touches[0];

  touchStartX=t.clientX;
  touchStartY=t.clientY;

},{passive:true});


canvas.addEventListener("touchend",e=>{

  if(!running)return;

  const t=e.changedTouches[0];

  const dx=t.clientX-touchStartX;
  const dy=t.clientY-touchStartY;

  const absX=Math.abs(dx);
  const absY=Math.abs(dy);

  const threshold=35;

  if(absX<20 && absY<20)return;

  if(absX>absY){

    if(dx>threshold){
      moveRight();
    }

    if(dx<-threshold){
      moveLeft();
    }

  }else{

    if(dy<-threshold){
      jump();
    }

    if(dy>threshold){
      slide();
    }
  }

},{passive:true});


/* =========================
   KEYBOARD
========================= */

addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft" || e.key==="a"){
    moveLeft();
  }

  if(e.key==="ArrowRight" || e.key==="d"){
    moveRight();
  }

  if(e.key==="ArrowUp" || e.key==="w" || e.key===" "){
    jump();
  }

  if(e.key==="ArrowDown" || e.key==="s"){
    slide();
  }

});


/* =========================
   SPAWN OBSTACLE
========================= */

function spawnObstacle(){

  const lane=Math.floor(Math.random()*3)-1;

  obstacles.push({
    lane,
    z:1,
    type:Math.random()<.5?"block":"bar"
  });
}


/* =========================
   SPAWN GEM
========================= */

function spawnGem(){

  const lane=Math.floor(Math.random()*3)-1;

  gems.push({
    lane,
    z:1,
    collected:false
  });
}


/* =========================
   UPDATE
========================= */

function update(){

  if(!running)return;

  distance+=speed;

  score+=speed*12;

  speed+=0.0000025;

  document.getElementById("score")
    .textContent=Math.floor(score);

  document.getElementById("coins")
    .textContent=coins;


  /* PLAYER */

  const target=getLaneX(
    player.lane,
    H*.82
  );

  player.x +=
    (target-player.x)*.18;


  /* JUMP */

  if(player.jump!==0 || player.vy!==0){

    player.jump+=player.vy;

    player.vy+=0.0018;

    if(player.jump>=0){

      player.jump=0;
      player.vy=0;
    }
  }


  /* SPAWN */

  spawnTimer-=speed;

  if(spawnTimer<=0){

    spawnObstacle();

    spawnTimer=.12+
      Math.random()*.12;
  }


  gemTimer-=speed;

  if(gemTimer<=0){

    spawnGem();

    gemTimer=.16+
      Math.random()*.2;
  }


  /* OBSTACLES */

  for(let i=obstacles.length-1;i>=0;i--){

    const o=obstacles[i];

    o.z-=speed;

    if(o.z<0){

      obstacles.splice(i,1);
      continue;
    }

    const p=1-o.z;

    const y=
      H*.30+
      p*p*(H*.60);

    const x=
      getLaneX(o.lane,y);


    /* COLLISION */

    if(
      o.lane===player.lane &&
      o.z<.18 &&
      o.z>.03
    ){

      if(player.jump<.02){

        if(o.type==="bar"){

          if(!player.sliding){
            gameOver();
          }

        }else{

          if(!player.sliding){
            gameOver();
          }
        }
      }
    }
  }


  /* GEMS */

  for(let i=gems.length-1;i>=0;i--){

    const g=gems[i];

    g.z-=speed;

    if(g.z<0){

      gems.splice(i,1);
      continue;
    }

    if(
      g.lane===player.lane &&
      g.z<.16 &&
      g.z>.03 &&
      player.jump<.18
    ){

      coins++;

      gems.splice(i,1);
    }
  }
}


/* =========================
   BACKGROUND
========================= */

function drawBackground(){

  const grad=
    ctx.createLinearGradient(
      0,0,0,H
    );

  grad.addColorStop(0,"#050505");
  grad.addColorStop(.45,"#111");
  grad.addColorStop(1,"#2a0000");

  ctx.fillStyle=grad;

  ctx.fillRect(0,0,W,H);


  /* moon */

  ctx.beginPath();

  ctx.arc(
    W*.78,
    H*.16,
    Math.min(W,H)*.055,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#ddd";
  ctx.globalAlpha=.75;
  ctx.fill();

  ctx.globalAlpha=1;


  /* CITY */

  const horizon=H*.30;

  for(let i=0;i<30;i++){

    const bw=20+Math.random()*45;
    const bh=30+Math.random()*120;

    const x=(i/30)*W;

    ctx.fillStyle=
      i%2
      ? "#111"
      : "#181818";

    ctx.fillRect(
      x,
      horizon-bh,
      bw,
      bh
    );
  }
}


/* =========================
   ROAD
========================= */

function drawRoad(){

  const horizon=H*.30;

  const r=roadAt(H);

  /* road */

  ctx.beginPath();

  ctx.moveTo(
    W*.43,
    horizon
  );

  ctx.lineTo(
    W*.57,
    horizon
  );

  ctx.lineTo(
    r.right,
    H
  );

  ctx.lineTo(
    r.left,
    H
  );

  ctx.closePath();

  ctx.fillStyle="#202020";

  ctx.fill();


  /* red sides */

  ctx.strokeStyle="#b00000";
  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(W*.43,horizon);
  ctx.lineTo(r.left,H);

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(W*.57,horizon);
  ctx.lineTo(r.right,H);

  ctx.stroke();


  /* lane lines */

  ctx.strokeStyle=
    "rgba(255,255,255,.25)";

  ctx.lineWidth=2;

  for(let i=1;i<3;i++){

    ctx.beginPath();

    ctx.moveTo(
      W*(.43+.14*i),
      horizon
    );

    const bottomX=
      r.left+r.width*(i/3);

    ctx.lineTo(
      bottomX,
      H
    );

    ctx.stroke();
  }


  /* road marks */

  const offset=
    (distance*3)%1;

  for(let i=0;i<12;i++){

    let t=(i/12+offset)%1;

    let y=
      horizon+
      t*t*(H-horizon);

    let len=
      5+t*45;

    ctx.strokeStyle=
      "rgba(255,255,255,.18)";

    ctx.lineWidth=
      2+t*3;

    const center=
      W/2;

    ctx.beginPath();

    ctx.moveTo(
      center-len,
      y
    );

    ctx.lineTo(
      center+len,
      y
    );

    ctx.stroke();
  }
}


/* =========================
   OBSTACLES
========================= */

function drawObstacle(o){

  const p=1-o.z;

  const y=
    H*.30+
    p*p*(H*.60);

  const x=
    getLaneX(o.lane,y);

  const scale=.15+p*1.3;

  const w=55*scale;
  const h=70*scale;


  ctx.save();

  ctx.translate(x,y);


  if(o.type==="block"){

    /* shadow */

    ctx.fillStyle=
      "rgba(0,0,0,.5)";

    ctx.fillRect(
      -w*.6,
      5,
      w*1.2,
      12
    );


    /* metal block */

    const g=
      ctx.createLinearGradient(
        -w/2,
        0,
        w/2,
        0
      );

    g.addColorStop(0,"#333");
    g.addColorStop(.5,"#777");
    g.addColorStop(1,"#222");

    ctx.fillStyle=g;

    ctx.fillRect(
      -w/2,
      -h,
      w,
      h
    );


    ctx.strokeStyle="#ff1717";
    ctx.lineWidth=4;

    ctx.strokeRect(
      -w/2,
      -h,
      w,
      h
    );

  }else{

    /* overhead bar */

    ctx.fillStyle="#333";

    ctx.fillRect(
      -w,
      -h*.9,
      w*2,
      h*.18
    );

    ctx.fillStyle="#b00000";

    ctx.fillRect(
      -w,
      -h*.9,
      w*2,
      h*.05
    );

    ctx.fillStyle="#222";

    ctx.fillRect(
      -w*.8,
      -h*.75,
      w*.12,
      h*.75
    );

    ctx.fillRect(
      w*.68,
      -h*.75,
      w*.12,
      h*.75
    );
  }

  ctx.restore();
}


/* =========================
   GEMS
========================= */

function drawGem(g){

  const p=1-g.z;

  const y=
    H*.30+
    p*p*(H*.60);

  const x=
    getLaneX(g.lane,y);

  const size=
    7+p*18;

  ctx.save();

  ctx.translate(
    x,
    y-size*1.8
  );

  ctx.rotate(
    distance*10
  );

  ctx.beginPath();

  ctx.moveTo(0,-size);
  ctx.lineTo(size*.7,0);
  ctx.lineTo(0,size);
  ctx.lineTo(-size*.7,0);
  ctx.closePath();

  const grad=
    ctx.createLinearGradient(
      -size,
      -size,
      size,
      size
    );

  grad.addColorStop(0,"#ffffff");
  grad.addColorStop(.3,"#55ffff");
  grad.addColorStop(1,"#0066ff");

  ctx.fillStyle=grad;

  ctx.shadowColor="#00ffff";
  ctx.shadowBlur=15;

  ctx.fill();

  ctx.restore();
}


/* =========================
   REALISTIC-STYLE CHARACTER
========================= */

function drawPlayer(){

  const groundY=H*.82;

  const jumpOffset=
    player.jump*H*.55;

  const x=player.x;
  const y=groundY-jumpOffset;

  ctx.save();

  ctx.translate(x,y);


  /* shadow */

  ctx.beginPath();

  ctx.ellipse(
    0,
    5,
    player.sliding?35:23,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(0,0,0,.55)";

  ctx.fill();


  const s=
    Math.min(W,H)/430;


  /* BODY */

  if(player.sliding){

    ctx.rotate(-.15);

    drawBody(s);

  }else{

    drawBody(s);
  }


  ctx.restore();
}


function drawBody(s){

  /* legs */

  ctx.fillStyle="#090909";

  ctx.beginPath();

  ctx.roundRect(
    -17*s,
    -5*s,
    13*s,
    42*s,
    6*s
  );

  ctx.fill();

  ctx.beginPath();

  ctx.roundRect(
    4*s,
    -5*s,
    13*s,
    42*s,
    6*s
  );

  ctx.fill();


  /* red boots */

  ctx.fillStyle="#8d0000";

  ctx.beginPath();

  ctx.roundRect(
    -20*s,
    28*s,
    17*s,
    10*s,
    4*s
  );

  ctx.fill();

  ctx.beginPath();

  ctx.roundRect(
    3*s,
    28*s,
    18*s,
    10*s,
    4*s
  );

  ctx.fill();


  /* torso armor */

  const armor=
    ctx.createLinearGradient(
      -25*s,
      -65*s,
      25*s,
      10*s
    );

  armor.addColorStop(0,"#333");
  armor.addColorStop(.35,"#111");
  armor.addColorStop(.7,"#050505");
  armor.addColorStop(1,"#222");

  ctx.fillStyle=armor;

  ctx.beginPath();

  ctx.roundRect(
    -27*s,
    -67*s,
    54*s,
    68*s,
    12*s
  );

  ctx.fill();


  /* red chest */

  ctx.fillStyle="#9d0000";

  ctx.beginPath();

  ctx.moveTo(0,-58*s);

  ctx.lineTo(17*s,-48*s);
  ctx.lineTo(12*s,-20*s);
  ctx.lineTo(0,-10*s);
  ctx.lineTo(-12*s,-20*s);
  ctx.lineTo(-17*s,-48*s);

  ctx.closePath();

  ctx.fill();


  /* chest highlight */

  ctx.strokeStyle="#ff3030";

  ctx.lineWidth=2*s;

  ctx.beginPath();

  ctx.moveTo(0,-54*s);
  ctx.lineTo(0,-18*s);

  ctx.stroke();


  /* shoulders */

  ctx.fillStyle="#171717";

  ctx.beginPath();

  ctx.arc(
    -28*s,
    -54*s,
    12*s,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    28*s,
    -54*s,
    12*s,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* arms */

  ctx.fillStyle="#0a0a0a";

  ctx.beginPath();

  ctx.roundRect(
    -38*s,
    -50*s,
    12*s,
    48*s,
    6*s
  );

  ctx.fill();

  ctx.beginPath();

  ctx.roundRect(
    26*s,
    -50*s,
    12*s,
    48*s,
    6*s
  );

  ctx.fill();


  /* red arm blades */

  ctx.fillStyle="#c00000";

  ctx.beginPath();

  ctx.moveTo(
    -38*s,
    -12*s
  );

  ctx.lineTo(
    -50*s,
    -2*s
  );

  ctx.lineTo(
    -35*s,
    -7*s
  );

  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(
    38*s,
    -12*s
  );

  ctx.lineTo(
    50*s,
    -2*s
  );

  ctx.lineTo(
    35*s,
    -7*s
  );

  ctx.closePath();

  ctx.fill();


  /* neck */

  ctx.fillStyle="#111";

  ctx.fillRect(
    -8*s,
    -78*s,
    16*s,
    12*s
  );


  /* HEAD */

  const head=
    ctx.createLinearGradient(
      -22*s,
      -110*s,
      22*s,
      -75*s
    );

  head.addColorStop(0,"#333");
  head.addColorStop(.45,"#090909");
  head.addColorStop(1,"#000");

  ctx.fillStyle=head;

  ctx.beginPath();

  ctx.arc(
    0,
    -91*s,
    22*s,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* helmet */

  ctx.strokeStyle="#444";

  ctx.lineWidth=3*s;

  ctx.beginPath();

  ctx.arc(
    0,
    -91*s,
    22*s,
    Math.PI,
    Math.PI*2
  );

  ctx.stroke();


  /* horns */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.moveTo(
    -14*s,
    -106*s
  );

  ctx.lineTo(
    -27*s,
    -128*s
  );

  ctx.lineTo(
    -8*s,
    -111*s
  );

  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(
    14*s,
    -106*s
  );

  ctx.lineTo(
    27*s,
    -128*s
  );

  ctx.lineTo(
    8*s,
    -111*s
  );

  ctx.closePath();

  ctx.fill();


  /* visor */

  ctx.fillStyle="#ff1515";

  ctx.shadowColor="#ff0000";
  ctx.shadowBlur=12*s;

  ctx.beginPath();

  ctx.roundRect(
    -16*s,
    -96*s,
    32*s,
    7*s,
    4*s
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /* visor shine */

  ctx.fillStyle="#ff7777";

  ctx.fillRect(
    -10*s,
    -94*s,
    7*s,
    2*s
  );
}


/* =========================
   DRAW
========================= */

function draw(){

  drawBackground();

  drawRoad();


  for(const g of gems){
    drawGem(g);
  }


  for(const o of obstacles){
    drawObstacle(o);
  }


  drawPlayer();
}


/* =========================
   MAIN LOOP
========================= */

function loop(){

  update();

  draw();

  requestAnimationFrame(loop);
}


document.getElementById("playBtn")
.addEventListener("click",startGame);

document.getElementById("againBtn")
.addEventListener("click",startGame);


/* START */

resetGame();

loop();

</script>
