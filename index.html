<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAIN GAMING - Endless Runner</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05030b;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  top:14px;
  left:15px;
  right:15px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  color:white;
  font-weight:bold;
  font-size:20px;
  text-shadow:0 2px 5px #000;
}

#title{
  color:#ff2938;
}

.panel{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
  background:rgba(3,2,10,.70);
}

.panel h1{
  color:#ff2637;
  font-size:48px;
  margin-bottom:5px;
  text-shadow:0 0 25px #ff1525;
}

.panel h2{
  color:#ff2637;
  font-size:42px;
  margin-bottom:15px;
}

.panel p{
  font-size:18px;
  margin:7px 0;
}

#play,
#again{
  margin-top:25px;
  border:2px solid #ff3947;
  border-radius:12px;
  background:#d7192a;
  color:white;
  font-size:24px;
  font-weight:bold;
  padding:14px 55px;
  box-shadow:0 0 25px rgba(255,30,50,.6);
}

#gameover{
  display:none;
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:25px;
  z-index:15;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
  pointer-events:none;
}

.control{
  width:68px;
  height:68px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  color:white;
  background:rgba(30,30,40,.75);
  border:2px solid rgba(255,255,255,.35);
  box-shadow:0 0 15px rgba(255,255,255,.12);
  pointer-events:auto;
  user-select:none;
}

.control:active{
  transform:scale(.9);
  background:rgba(220,20,40,.8);
}

@media(max-width:600px){
  #hud{
    font-size:17px;
  }

  .panel h1{
    font-size:38px;
  }

  .control{
    width:62px;
    height:62px;
    font-size:27px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="title">⚡ PAIN GAMING</div>
  <div>🏆 <span id="score">0</span></div>
  <div>💎 <span id="coins">0</span></div>
</div>

<div id="start" class="panel">
  <h1>PAIN GAMING</h1>
  <p>ENDLESS RUNNER</p>
  <p>⬅️ ➡️ تغيير المسار</p>
  <p>⬆️ قفز &nbsp;&nbsp; ⬇️ انحناء</p>
  <button id="play">PLAY</button>
</div>

<div id="gameover" class="panel">
  <h2>GAME OVER</h2>
  <p>Score: <span id="finalScore">0</span></p>
  <p>💎 Coins: <span id="finalCoins">0</span></p>
  <button id="again">PLAY AGAIN</button>
</div>

<div id="controls">
  <div class="control" id="left">⬅️</div>
  <div class="control" id="jump">⬆️</div>
  <div class="control" id="slide">⬇️</div>
  <div class="control" id="right">➡️</div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

  DPR = Math.min(window.devicePixelRatio || 1,2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * DPR;
  canvas.height = H * DPR;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR,0,0,DPR,0,0);

  player.x = laneX(player.lane);
}

window.addEventListener("resize",resize);

let running = false;

let score = 0;
let coins = 0;
let speed = 7;
let distance = 0;

let obstacleTimer = 80;
let gemTimer = 40;

const player = {

  lane:1,

  x:0,

  jump:0,

  vy:0,

  sliding:false

};

let obstacles = [];
let gems = [];

/* =========================
   ROAD
========================= */

function laneX(lane){

  const roadLeft = W * .12;
  const roadWidth = W * .76;

  return roadLeft + roadWidth * ((lane + .5) / 3);

}

/* =========================
   RESET
========================= */

function resetGame(){

  score = 0;
  coins = 0;
  speed = 7;
  distance = 0;

  obstacleTimer = 80;
  gemTimer = 40;

  player.lane = 1;
  player.x = laneX(1);
  player.jump = 0;
  player.vy = 0;
  player.sliding = false;

  obstacles = [];
  gems = [];

  document.getElementById("score").textContent = "0";
  document.getElementById("coins").textContent = "0";

}

/* =========================
   START
========================= */

function startGame(){

  resetGame();

  running = true;

  document.getElementById("start").style.display = "none";
  document.getElementById("gameover").style.display = "none";

}

document.getElementById("play").addEventListener("click",startGame);
document.getElementById("again").addEventListener("click",startGame);

/* =========================
   GAME OVER
========================= */

function gameOver(){

  if(!running)return;

  running = false;

  document.getElementById("finalScore").textContent =
    Math.floor(score);

  document.getElementById("finalCoins").textContent =
    coins;

  document.getElementById("gameover").style.display = "flex";

}

/* =========================
   MOVEMENT
========================= */

function moveLeft(){

  if(!running)return;

  player.lane--;

  if(player.lane < 0){
    player.lane = 0;
  }

}

function moveRight(){

  if(!running)return;

  player.lane++;

  if(player.lane > 2){
    player.lane = 2;
  }

}

function jump(){

  if(!running)return;

  if(player.jump === 0){

    player.vy = 16;

  }

}

function slide(){

  if(!running)return;

  if(player.sliding)return;

  player.sliding = true;

  setTimeout(function(){

    player.sliding = false;

  },600);

}

/* =========================
   BUTTONS
========================= */

function touchButton(id,fn){

  const el = document.getElementById(id);

  el.addEventListener("touchstart",function(e){

    e.preventDefault();
    fn();

  },{passive:false});

  el.addEventListener("mousedown",function(e){

    e.preventDefault();
    fn();

  });

}

touchButton("left",moveLeft);
touchButton("right",moveRight);
touchButton("jump",jump);
touchButton("slide",slide);

/* =========================
   KEYBOARD
========================= */

window.addEventListener("keydown",function(e){

  if(e.key === "ArrowLeft"){
    moveLeft();
  }

  if(e.key === "ArrowRight"){
    moveRight();
  }

  if(e.key === "ArrowUp" || e.key === " "){
    jump();
  }

  if(e.key === "ArrowDown"){
    slide();
  }

});

/* =========================
   SWIPE
========================= */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart",function(e){

  const t = e.touches[0];

  touchStartX = t.clientX;
  touchStartY = t.clientY;

},{passive:true});

canvas.addEventListener("touchend",function(e){

  const t = e.changedTouches[0];

  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;

  if(Math.abs(dx) > Math.abs(dy)){

    if(dx > 45){
      moveRight();
    }

    if(dx < -45){
      moveLeft();
    }

  }else{

    if(dy < -45){
      jump();
    }

    if(dy > 45){
      slide();
    }

  }

},{passive:true});

/* =========================
   SPAWN OBSTACLE
========================= */

function spawnObstacle(){

  const lane = Math.floor(Math.random()*3);

  const type =
    Math.random() < .25
    ? "high"
    : "block";

  obstacles.push({

    lane:lane,

    z:1,

    type:type

  });

}

/* =========================
   SPAWN GEM
========================= */

function spawnGem(){

  const lane = Math.floor(Math.random()*3);

  gems.push({

    lane:lane,

    z:1,

    collected:false

  });

}

/* =========================
   UPDATE
========================= */

function update(){

  if(!running)return;

  distance += speed;

  score += speed * .04;

  speed += .0015;

  obstacleTimer -= speed;
  gemTimer -= speed;

  if(obstacleTimer <= 0){

    spawnObstacle();

    obstacleTimer =
      180 + Math.random()*170;

  }

  if(gemTimer <= 0){

    spawnGem();

    gemTimer =
      90 + Math.random()*100;

  }

  /* jump */

  if(player.jump > 0 || player.vy !== 0){

    player.jump += player.vy;

    player.vy -= .75;

    if(player.jump <= 0){

      player.jump = 0;
      player.vy = 0;

    }

  }

  /* smooth lane movement */

  const targetX = laneX(player.lane);

  player.x +=
    (targetX-player.x)*.18;

  /* move objects */

  for(let o of obstacles){

    o.z -= speed*.0028;

  }

  for(let g of gems){

    g.z -= speed*.0028;

  }

  checkCollisions();

  obstacles =
    obstacles.filter(o=>o.z > -.15);

  gems =
    gems.filter(g=>g.z > -.15 && !g.collected);

  document.getElementById("score").textContent =
    Math.floor(score);

  document.getElementById("coins").textContent =
    coins;

}

/* =========================
   COLLISIONS
========================= */

function checkCollisions(){

  for(let o of obstacles){

    if(
      o.z < .17 &&
      o.z > .015 &&
      o.lane === player.lane
    ){

      if(o.type === "block"){

        if(player.jump < 55){

          gameOver();
          return;

        }

      }else{

        if(!player.sliding){

          gameOver();
          return;

        }

      }

    }

  }

  for(let g of gems){

    if(
      g.z < .18 &&
      g.z > .01 &&
      g.lane === player.lane &&
      !g.collected
    ){

      coins++;

      score += 25;

      g.collected = true;

    }

  }

}

/* =========================
   BACKGROUND
========================= */

function drawBackground(){

  const horizon = H*.31;

  const gradient =
    ctx.createLinearGradient(0,0,0,H);

  gradient.addColorStop(0,"#05030d");
  gradient.addColorStop(.5,"#16102a");
  gradient.addColorStop(1,"#05040a");

  ctx.fillStyle = gradient;

  ctx.fillRect(0,0,W,H);

  /* stars */

  for(let i=0;i<55;i++){

    const x =
      (i*97)%W;

    const y =
      (i*53)%(horizon-20);

    ctx.fillStyle =
      "rgba(255,255,255,.55)";

    ctx.fillRect(x,y,2,2);

  }

  /* moon */

  ctx.beginPath();

  ctx.arc(
    W*.82,
    H*.13,
    Math.min(W,H)*.045,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "rgba(210,210,235,.3)";

  ctx.fill();

  /* city */

  const count = 20;

  for(let i=0;i<count;i++){

    const bw =
      25 + (i*17)%45;

    const bh =
      50 + (i*31)%130;

    const x =
      i*(W/count);

    ctx.fillStyle = "#0d0c18";

    ctx.fillRect(
      x,
      horizon-bh,
      bw,
      bh
    );

    for(
      let y=horizon-bh+15;
      y<horizon-8;
      y+=22
    ){

      ctx.fillStyle="#c51f2f";

      ctx.fillRect(
        x+7,
        y,
        5,
        7
      );

    }

  }

}

/* =========================
   ROAD
========================= */

function drawRoad(){

  const horizon = H*.31;

  /* road */

  ctx.beginPath();

  ctx.moveTo(
    W*.43,
    horizon
  );

  ctx.lineTo(
    W*.57,
    horizon
  );

  ctx.lineTo(
    W*.96,
    H
  );

  ctx.lineTo(
    W*.04,
    H
  );

  ctx.closePath();

  const roadGradient =
    ctx.createLinearGradient(
      0,
      horizon,
      0,
      H
    );

  roadGradient.addColorStop(
    0,
    "#24202f"
  );

  roadGradient.addColorStop(
    1,
    "#07070b"
  );

  ctx.fillStyle = roadGradient;

  ctx.fill();

  /* red edges */

  ctx.strokeStyle="#ff2538";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    W*.43,
    horizon
  );

  ctx.lineTo(
    W*.04,
    H
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    W*.57,
    horizon
  );

  ctx.lineTo(
    W*.96,
    H
  );

  ctx.stroke();

  /* lanes */

  for(let lane=1;lane<3;lane++){

    const topX =
      W*.43 +
      W*.14*(lane/3);

    const bottomX =
      W*.04 +
      W*.92*(lane/3);

    ctx.strokeStyle =
      "rgba(255,255,255,.28)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
      topX,
      horizon
    );

    ctx.lineTo(
      bottomX,
      H
    );

    ctx.stroke();

  }

  /* road lights */

  for(let i=0;i<10;i++){

    const p =
      ((distance*.004+i/10)%1);

    const y =
      horizon +
      p*p*(H-horizon);

    const leftX =
      W*.43 -
      p*(W*.39);

    const rightX =
      W*.57 +
      p*(W*.39);

    ctx.fillStyle="#ff2435";

    ctx.fillRect(
      leftX,
      y,
      5+p*6,
      5+p*6
    );

    ctx.fillRect(
      rightX,
      y,
      5+p*6,
      5+p*6
    );

  }

}

/* =========================
   OBSTACLE
========================= */

function drawObstacle(o){

  if(o.z>1)return;

  const p = 1-o.z;

  const x = laneX(o.lane);

  const horizon = H*.31;

  const y =
    horizon +
    p*p*(H*.60);

  const size =
    35+p*80;

  if(o.type === "block"){

    ctx.save();

    ctx.shadowColor="#ff1d32";
    ctx.shadowBlur=20;

    ctx.fillStyle="#d51c2e";

    ctx.fillRect(
      x-size/2,
      y-size,
      size,
      size
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#25050a";

    ctx.fillRect(
      x-size*.30,
      y-size*.72,
      size*.60,
      size*.13
    );

    ctx.restore();

  }else{

    /* high barrier */

    ctx.save();

    ctx.strokeStyle="#ff2639";
    ctx.lineWidth=
      8+p*8;

    ctx.shadowColor="#ff2035";
    ctx.shadowBlur=15;

    ctx.beginPath();

    ctx.moveTo(
      x-size,
      y-size*.8
    );

    ctx.lineTo(
      x+size,
      y-size*.8
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.strokeStyle="#7c1421";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
      x-size,
      y-size*.8
    );

    ctx.lineTo(
      x-size,
      y
    );

    ctx.moveTo(
      x+size,
      y-size*.8
    );

    ctx.lineTo(
      x+size,
      y
    );

    ctx.stroke();

    ctx.restore();

  }

}

/* =========================
   GEM
========================= */

function drawGem(g){

  if(g.z>1)return;

  const p = 1-g.z;

  const x = laneX(g.lane);

  const horizon = H*.31;

  const y =
    horizon +
    p*p*(H*.60);

  const size =
    10+p*25;

  ctx.save();

  ctx.translate(
    x,
    y-size*2
  );

  ctx.rotate(
    Math.PI/4
  );

  ctx.fillStyle="#25d9ff";

  ctx.shadowColor="#00cfff";

  ctx.shadowBlur=20;

  ctx.fillRect(
    -size/2,
    -size/2,
    size,
    size
  );

  ctx.restore();

  ctx.shadowBlur=0;

}

/* =========================
   PLAYER
========================= */

function drawPlayer(){

  const x = player.x;

  const ground = H*.82;

  const y =
    ground-player.jump;

  ctx.save();

  ctx.translate(x,y);

  let scale =
    player.sliding ? .72 : 1;

  ctx.scale(scale,scale);

  /* shadow */

  ctx.beginPath();

  ctx.ellipse(
    0,
    7,
    38,
    10,
    0,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "rgba(0,0,0,.55)";

  ctx.fill();

  /* legs */

  ctx.fillStyle="#0b0c10";

  ctx.fillRect(
    -20,
    -65,
    15,
    55
  );

  ctx.fillRect(
    5,
    -65,
    15,
    55
  );

  /* boots */

  ctx.fillStyle="#e92335";

  ctx.fillRect(
    -23,
    -15,
    20,
    10
  );

  ctx.fillRect(
    4,
    -15,
    20,
    10
  );

  /* body */

  ctx.fillStyle="#101216";

  ctx.beginPath();

  ctx.moveTo(-30,-128);
  ctx.lineTo(30,-128);
  ctx.lineTo(36,-67);
  ctx.lineTo(0,-45);
  ctx.lineTo(-36,-67);

  ctx.closePath();

  ctx.fill();

  /* chest red */

  ctx.fillStyle="#df2031";

  ctx.beginPath();

  ctx.moveTo(0,-120);
  ctx.lineTo(18,-96);
  ctx.lineTo(0,-70);
  ctx.lineTo(-18,-96);

  ctx.closePath();

  ctx.fill();

  /* shoulders */

  ctx.fillStyle="#16181c";

  ctx.beginPath();

  ctx.arc(
    -31,
    -109,
    14,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    31,
    -109,
    14,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* arms */

  ctx.strokeStyle="#111318";

  ctx.lineWidth=18;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    -25,
    -108
  );

  ctx.lineTo(
    -50,
    -70
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    25,
    -108
  );

  ctx.lineTo(
    50,
    -70
  );

  ctx.stroke();

  /* red blades */

  ctx.strokeStyle="#ff2438";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    -47,
    -82
  );

  ctx.lineTo(
    -58,
    -106
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    47,
    -82
  );

  ctx.lineTo(
    58,
    -106
  );

  ctx.stroke();

  /* helmet */

  ctx.fillStyle="#080a0e";

  ctx.beginPath();

  ctx.arc(
    0,
    -147,
    32,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* horns */

  ctx.fillStyle="#ed2538";

  ctx.beginPath();

  ctx.moveTo(-21,-165);
  ctx.lineTo(-37,-199);
  ctx.lineTo(-7,-174);

  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(21,-165);
  ctx.lineTo(37,-199);
  ctx.lineTo(7,-174);

  ctx.closePath();

  ctx.fill();

  /* visor */

  ctx.fillStyle="#ff3342";

  ctx.shadowColor="#ff2438";

  ctx.shadowBlur=12;

  ctx.fillRect(
    -22,
    -152,
    44,
    8
  );

  ctx.shadowBlur=0;

  ctx.restore();

}

/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawRoad();

  for(let g of gems){
    drawGem(g);
  }

  for(let o of obstacles){
    drawObstacle(o);
  }

  drawPlayer();

}

/* =========================
   MAIN LOOP
========================= */

function gameLoop(){

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

/* =========================
   START ENGINE
========================= */

resize();

player.x = laneX(1);

gameLoop();

</script>

</body>
</html>
